name: "Herb"

services:
    db:
        image: postgres:18.4-alpine
        container_name: herb-db
        environment:
            PGUSER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME}
            POSTGRES_PORT:
        volumes:
            - db-data:/var/lib/herb
        healthcheck:
            test: ["CMD", "pg_isready"]
            interval: 10s
            timeout: 5s
            retries: 5
        ports:
            - "3020:5432"

    # backup:
    #     image: postgres:18.4-alpine
    #     container_name: herb-db-backup

    crawler:
        build:
            context: ./crawler
            dockerfile: ./build/dockerfile
        container_name: herb-crawler
        depends_on:
            db:
                condition: service_healthy
        env_file:
            - ./.env
        # ports:
        #     - "3021:3001"

    indexer:
        build:
            context: ./indexer
            dockerfile: ./dockerfile
        container_name: herb-indexer
        depends_on:
            db:
                condition: service_healthy
        env_file:
            - ./.env
        ports:
            - "3021:3000"

    client:
        build:
            context: ./client
            dockerfile: ./dockerfile
        depends_on:
            db:
                condition: service_healthy
        ports:
            - "3022:3000"

volumes:
    db-data:
